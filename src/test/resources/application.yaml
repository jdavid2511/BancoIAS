spring:
  application:
    name: BancoIAS
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    virtual-host: /
  r2dbc:
    url: r2dbc:h2:mem:///bancoias-test;DB_CLOSE_DELAY=-1
    username: sa
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

rabbit:
  queue:
    name: bancoias-transact-queue

logging:
  level:
    com.bancoias: INFO